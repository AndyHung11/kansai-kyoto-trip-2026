/* ---------- render & init ---------- */
function errorPanel(title, err, raw) {

  const m = /position (\d+)/.exec(msg);
  if (m && raw) { const p = +m[1]; snip = raw.slice(Math.max(0, p - 120), p) + ' ⟵ HERE ⟶ ' + raw.slice(p, p + 80); }
