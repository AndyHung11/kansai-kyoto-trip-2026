/* User-requested custom enhancement (2026-10-18): click a budget category bar to expand its itemized line list.

    (D.journey && D.journey.currencies || []).forEach(function(c){ if (c && c.code && isFinite(+c.rate)) r[c.code] = +c.rate; });
    return r;

      var rate = rates[a.currency]; if (!isFinite(rate)) return;
      var twd = (+a.amount) * mult * rate;
      (cats[ln.category] = cats[ln.category] || []).push({ label: ln.label, twd: twd });
    });
    return cats;
  }
  document.addEventListener('click', function(e){
    var bar = e.target && e.target.closest ? e.target.closest('.bars > .bar') : null;
    if (!bar) return;
    var next = bar.nextElementSibling;
    if (next && next.classList && next.classList.contains('bar-detail')) { next.remove(); return; }
    var parent = bar.parentElement;
    if (!parent) return;
    parent.querySelectorAll('.bar-detail').forEach(function(d){ d.remove(); });
    var D = getData();
    if (!D) return;
    var cats = categorize(D);
    var sortedCats = Object.keys(cats).sort(function(a, b){
      var ta = cats[a].reduce(function(s, x){ return s + x.twd; }, 0);
      var tb = cats[b].reduce(function(s, x){ return s + x.twd; }, 0);
      return tb - ta;
    });
    var idx = Array.prototype.indexOf.call(parent.children, bar);
    var items = cats[sortedCats[idx]] || [];
    var detail = document.createElement('div');
    detail.className = 'bar-detail';
    detail.style.cssText = 'font-size:12.5px;color:var(--text2);background:var(--hover);border-radius:8px;padding:8px 10px';
    if (items.length) {
      var ul = document.createElement('ul');
      ul.style.cssText = 'margin:0;padding-left:18px;display:grid;gap:3px';
      items.forEach(function(it){
        var li = document.createElement('li');
        li.style.cssText = 'display:flex;justify-content:space-between;gap:10px';
        var l = document.createElement('span'); l.textContent = it.label;
        var a = document.createElement('span'); a.textContent = fmtNT(it.twd); a.style.whiteSpace = 'nowrap';
        li.appendChild(l); li.appendChild(a);
        ul.appendChild(li);
      });
      detail.appendChild(ul);
    } else {
      detail.textContent = '\u6c92\u6709\u627e\u5230\u9019\u500b\u5206\u985e\u7684\u660e\u7d30\u3002';
    }
    bar.insertAdjacentElement('afterend', detail);
  }, true);
  document.addEventListener('mouseover', function(e){
    var bar = e.target && e.target.closest ? e.target.closest('.bars > .bar') : null;
    if (bar) bar.style.cursor = 'pointer';
  });
})();
</script>
</body>
</html>
